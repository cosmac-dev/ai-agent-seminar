name: Dev Container image (GPU)

# NVIDIA GPU 用 Dev Container イメージ（.devcontainer/image-gpu）のビルド・テストと公開。
# - verify: linux/amd64 をビルドし、スモークテストと requirements.txt の再生成差分を確認する。
#   レジストリへのログイン・push は行わない。
#   CI には GPU がないため、GPU が使えるかは確かめない（CUDA 版の torch であることだけを確かめる）。
# - publish: タグ devcontainer-image-gpu/vMAJOR.MINOR.PATCH の push で動き、GITHUB_TOKEN で
#   ghcr.io/cosmac-dev/ai-agent-seminar-devcontainer-gpu に linux/amd64 を push する。公開済みの版は上書きしない。
# イメージが大きい（展開後およそ 10 GB）ため、ランナーの不要なツールを消してからビルドし、
# ビルドしてスモークテストしたイメージをそのまま push する。

on:
  pull_request:
    paths:
      - ".devcontainer/image-gpu/**"
      - ".github/workflows/devcontainer-image-gpu.yml"
  push:
    branches:
      - main
    tags:
      - "devcontainer-image-gpu/v*"
    paths:
      - ".devcontainer/image-gpu/**"
      - ".github/workflows/devcontainer-image-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/cosmac-dev/ai-agent-seminar-devcontainer-gpu
  LOCAL_TAG: ai-agent-seminar-devcontainer-gpu:ci

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check requirements.txt is up to date
        working-directory: .devcontainer/image-gpu
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e UV_CACHE_DIR=/tmp/uv-cache \
            -v "$PWD:/w" -w /w \
            ghcr.io/astral-sh/uv:0.13.4-python3.13-trixie-slim@sha256:bd45432c1376a243b6761b3546b344caff2d6e2a2b9530354f99b609b1f10ef1 \
            uv pip compile requirements.in --python-version 3.13 --python-platform x86_64-manylinux_2_28 --generate-hashes --quiet \
              --custom-compile-command "uv pip compile requirements.in --python-version 3.13 --python-platform x86_64-manylinux_2_28 --generate-hashes -o requirements.txt" \
              -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build (linux/amd64)
        run: docker build --platform linux/amd64 --build-arg IMAGE_VERSION=ci -t "${LOCAL_TAG}" .devcontainer/image-gpu

      - name: Smoke test
        run: docker run --rm --network none --user vscode "${LOCAL_TAG}" bash /usr/local/share/ai-agent-seminar/smoke-test.sh

  publish:
    needs: verify
    if: github.repository == 'cosmac-dev/ai-agent-seminar' && startsWith(github.ref, 'refs/tags/devcontainer-image-gpu/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: devcontainer-image-gpu-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .devcontainer/image-gpu/VERSION)"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^devcontainer-image-gpu/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid tag: ${GITHUB_REF_NAME} (expected devcontainer-image-gpu/vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${version}" ]]; then
            echo "::error::Tag version ${BASH_REMATCH[1]} does not match .devcontainer/image-gpu/VERSION (${version})"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同じ版が公開済みなら push せずに終える（同じタグが再び push された場合など）。
      - name: Check whether the version is published
        id: published
        env:
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: |
          set -euo pipefail
          # 「見つからない」と明示された場合だけ未公開とみなす。認証・通信の失敗は止める。
          if output="$(docker buildx imagetools inspect "${REFERENCE}" 2>&1)"; then
            echo "::warning::${REFERENCE} is already published. Bump .devcontainer/image-gpu/VERSION to publish changes."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! grep -Eq ': not found$|manifest unknown' <<< "${output}"; then
            echo "::error::Could not determine whether ${REFERENCE} exists:"
            echo "${output}"
            exit 1
          fi
          echo "${REFERENCE} is not published yet."
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Free disk space
        if: steps.published.outputs.publish == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build and smoke test
        if: steps.published.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg IMAGE_VERSION="${VERSION}" -t "${REFERENCE}" .devcontainer/image-gpu
          docker run --rm --network none --user vscode "${REFERENCE}" \
            bash /usr/local/share/ai-agent-seminar/smoke-test.sh

      - name: Push
        if: steps.published.outputs.publish == 'true'
        env:
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: docker push "${REFERENCE}"

      - name: Show published manifest
        env:
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: docker buildx imagetools inspect "${REFERENCE}"
