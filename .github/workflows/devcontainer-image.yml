name: Dev Container image

# 共通 Dev Container イメージ（.devcontainer/image）のビルド・テストと公開。
# このファイルは m-higuchi/ai-agent-seminar で管理し、sync/devcontainer-image-v* タグで
# cosmac-dev/ai-agent-seminar に同期する。
# - verify: linux/amd64 をビルドし、スモークテストと設定の整合性を確認する。レジストリへのログイン・push は行わない。
#   m-higuchi/ai-agent-seminar では Pull Request、main への push、手動実行で動く。
#   cosmac-dev/ai-agent-seminar では公開タグの push でだけ動く（各回の同期のたびにはビルドしない）。
# - publish: cosmac-dev/ai-agent-seminar のタグ devcontainer-image/vMAJOR.MINOR.PATCH の push でだけ動き、
#   GITHUB_TOKEN で ghcr.io/cosmac-dev/ai-agent-seminar-devcontainer に linux/amd64・linux/arm64 を push する。
#   公開タグは同期ワークフローが作る。公開済みの版は上書きしない。手順は .devcontainer/README.md。

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  push:
    branches:
      - main
    tags:
      - "devcontainer-image/v*"
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'm-higuchi/ai-agent-seminar' || startsWith(github.ref, 'refs/tags/devcontainer-image/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 公開リポジトリには同期していない回の構成もあるため、構成の検査は管理元のリポジトリでだけ行う
      - name: Check devcontainer configs
        if: github.repository == 'm-higuchi/ai-agent-seminar'
        run: python3 .devcontainer/image/check-configs.py

      - name: Check requirements.txt is up to date
        working-directory: .devcontainer/image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e UV_CACHE_DIR=/tmp/uv-cache \
            -v "$PWD:/w" -w /w \
            ghcr.io/astral-sh/uv:0.13.4-python3.13-trixie-slim@sha256:bd45432c1376a243b6761b3546b344caff2d6e2a2b9530354f99b609b1f10ef1 \
            uv pip compile requirements.in --universal --python-version 3.13 --generate-hashes --quiet \
              --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.13 --generate-hashes -o requirements.txt" \
              -o requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer/image
          platforms: linux/amd64
          load: true
          push: false
          tags: ai-agent-seminar-devcontainer:ci
          build-args: |
            IMAGE_VERSION=ci

      - name: Smoke test
        run: docker run --rm --network none --user vscode ai-agent-seminar-devcontainer:ci bash /usr/local/share/ai-agent-seminar/smoke-test.sh

  publish:
    needs: verify
    if: github.repository == 'cosmac-dev/ai-agent-seminar' && startsWith(github.ref, 'refs/tags/devcontainer-image/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: devcontainer-image-publish
      cancel-in-progress: false
    env:
      IMAGE_NAME: ghcr.io/cosmac-dev/ai-agent-seminar-devcontainer
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .devcontainer/image/VERSION)"
          if [[ ! "${GITHUB_REF_NAME}" =~ ^devcontainer-image/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid tag: ${GITHUB_REF_NAME} (expected devcontainer-image/vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "${version}" ]]; then
            echo "::error::Tag version ${BASH_REMATCH[1]} does not match .devcontainer/image/VERSION (${version})"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 同じ版が公開済みなら push せずに終える（同期のやり直しで同じタグが再び push された場合など）。
      - name: Check whether the version is published
        id: published
        env:
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: |
          set -euo pipefail
          # 「見つからない」と明示された場合だけ未公開とみなす。認証・通信の失敗は止める。
          if output="$(docker buildx imagetools inspect "${REFERENCE}" 2>&1)"; then
            echo "::warning::${REFERENCE} is already published. Bump .devcontainer/image/VERSION to publish changes."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! grep -Eq ': not found$|manifest unknown' <<< "${output}"; then
            echo "::error::Could not determine whether ${REFERENCE} exists:"
            echo "${output}"
            exit 1
          fi
          echo "${REFERENCE} is not published yet."
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        if: steps.published.outputs.publish == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.published.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke test each platform
        if: steps.published.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          IFS=',' read -ra platforms <<< "${PLATFORMS}"
          for platform in "${platforms[@]}"; do
            tag="ai-agent-seminar-devcontainer:publish-${platform##*/}"
            docker buildx build --platform "${platform}" --load \
              --build-arg IMAGE_VERSION="${VERSION}" -t "${tag}" .devcontainer/image
            docker run --rm --platform "${platform}" --network none --user vscode "${tag}" \
              bash /usr/local/share/ai-agent-seminar/smoke-test.sh
          done

      - name: Push
        if: steps.published.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer/image
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.version.outputs.reference }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Show published manifest
        env:
          REFERENCE: ${{ steps.version.outputs.reference }}
        run: docker buildx imagetools inspect "${REFERENCE}"
