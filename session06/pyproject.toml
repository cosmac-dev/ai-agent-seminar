[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemonic-agent-session06"
version = "0.1.0"
description = "AI agent seminar session 06: 短期・長期記憶を搭載したAIエージェント"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2",
    "numpy>=1.24",
]

[project.optional-dependencies]
server = ["langgraph-cli[inmem]>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]
