[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent"
version = "0.1.0"
description = "Minimal ReAct agent for the session04 tool-use exercise."
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
]

[tool.setuptools.packages.find]
where = ["src"]
